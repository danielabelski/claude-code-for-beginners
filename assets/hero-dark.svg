<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Claude Code for Beginners - from your first prompt to shipping in production">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1612"/>
      <stop offset="0.5" stop-color="#241d17"/>
      <stop offset="1" stop-color="#2e251e"/>
    </linearGradient>
    <linearGradient id="tiers" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4b393"/>
      <stop offset="0.5" stop-color="#d97757"/>
      <stop offset="1" stop-color="#c15f3f"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2b8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#32CD32" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="14" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <circle cx="1040" cy="90" r="320" fill="url(#glowA)"/>
    <circle cx="120" cy="400" r="260" fill="url(#glowB)"/>
    <rect width="1280" height="5" fill="url(#tiers)"/>
  </g>

  <!-- Eyebrow -->
  <rect x="72" y="72" width="428" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="92" cy="88" r="4" fill="#d97757"/>
  <text x="106" y="93" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#f3e6de">FREE COURSE · SELF-PACED · PROJECT-BASED</text>

  <!-- Title -->
  <text x="70" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#ffffff">Claude Code</text>
  <text x="70" y="254" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-1.5" fill="url(#tiers)">for Beginners</text>

  <!-- Tagline -->
  <text x="72" y="306" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#d8cec5">From your first prompt to shipping in production.</text>
  <text x="72" y="338" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#9d928a">15 modules. 9+ hours. Zero cost.</text>

  <!-- Terminal -->
  <g filter="url(#shadow)">
    <rect x="712" y="66" width="500" height="290" rx="14" fill="#14100d"/>
  </g>
  <rect x="712.5" y="66.5" width="499" height="289" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <path d="M712 80a14 14 0 0 1 14-14h472a14 14 0 0 1 14 14v22H712z" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="736" cy="84" r="6" fill="#ff5f57"/>
  <circle cx="756" cy="84" r="6" fill="#febc2e"/>
  <circle cx="776" cy="84" r="6" fill="#28c840"/>
  <text x="962" y="89" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7d7066">~/my-api</text>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" xml:space="preserve">
    <text x="736" y="138"><tspan fill="#d97757">$</tspan><tspan fill="#f3ece6"> claude</tspan></text>
    <text x="736" y="172"><tspan fill="#f4b393">&gt;</tspan><tspan fill="#f3ece6"> Add JWT auth to the API, with tests</tspan></text>
    <text x="736" y="210"><tspan fill="#d97757">●</tspan><tspan fill="#b8aca2"> Read  src/routes/  src/models/user.ts</tspan></text>
    <text x="736" y="238"><tspan fill="#d97757">●</tspan><tspan fill="#b8aca2"> Edit  src/middleware/auth.ts </tspan><tspan fill="#6fcf7a">+42</tspan></text>
    <text x="736" y="266"><tspan fill="#d97757">●</tspan><tspan fill="#b8aca2"> Bash  npm test</tspan></text>
    <text x="736" y="300"><tspan fill="#6fcf7a">✓ 24 passed</tspan><tspan fill="#7d7066">  ·  ready to commit</tspan></text>
    <text x="736" y="334"><tspan fill="#f4b393">&gt;</tspan></text>
    <rect x="752" y="321" width="9" height="17" fill="#f3ece6">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
