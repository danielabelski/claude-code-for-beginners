<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" role="img" aria-label="400+ GitHub stars, 15 modules, 9+ hours of content, free forever">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1612"/>
      <stop offset="0.5" stop-color="#241d17"/>
      <stop offset="1" stop-color="#2e251e"/>
    </linearGradient>
    <linearGradient id="tiers" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4b393"/>
      <stop offset="0.5" stop-color="#d97757"/>
      <stop offset="1" stop-color="#c15f3f"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="150" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="150" fill="url(#bg)"/>
    <rect y="145" width="1280" height="5" fill="url(#tiers)"/>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.1">
    <line x1="320" y1="34" x2="320" y2="116"/>
    <line x1="640" y1="34" x2="640" y2="116"/>
    <line x1="960" y1="34" x2="960" y2="116"/>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="160" y="82" font-size="46" font-weight="800" letter-spacing="-1" fill="#e8906f">400+</text>
    <text x="160" y="112" font-size="16" font-weight="600" fill="#b3a79d">GitHub stars</text>

    <text x="480" y="82" font-size="46" font-weight="800" letter-spacing="-1" fill="#e8906f">15</text>
    <text x="480" y="112" font-size="16" font-weight="600" fill="#b3a79d">hands-on modules</text>

    <text x="800" y="82" font-size="46" font-weight="800" letter-spacing="-1" fill="#e8906f">9+ hrs</text>
    <text x="800" y="112" font-size="16" font-weight="600" fill="#b3a79d">of content</text>

    <text x="1120" y="82" font-size="46" font-weight="800" letter-spacing="-1" fill="#e8906f">$0</text>
    <text x="1120" y="112" font-size="16" font-weight="600" fill="#b3a79d">free forever</text>
  </g>
</svg>
